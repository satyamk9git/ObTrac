[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obtrac"
version = "0.6.8"
description = "ObTrac - RAG Observability & Evaluation Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Satyam Verma" }
]
license = { text = "MIT" }
keywords = ["rag", "observability", "llm", "ragas", "tracing", "evaluation"]
dependencies = [
    # SDK core
    "requests>=2.31.0,<3.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # Backend (FastAPI)
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "cryptography>=42.0.0,<51.0.0",  # app/core/crypto.py — at-rest encryption for provider API keys

    # LLM & Eval — the langchain/langgraph/ragas family broke hard (removed
    # classes, cross-incompatible langchain-core majors) on nothing more
    # than a floor-only ">=" constraint. Pin exact versions here — bump
    # deliberately, and re-verify RAGAS eval + a LangGraph run still work
    # (there is no CI coverage for the eval path yet — see CONTRIBUTING.md)
    # before raising any of these.
    "litellm==1.98.0",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "datasets>=2.19.0,<5.0.0",
    "openai>=2.20.0,<3.0.0",  # litellm==1.98.0 requires >=2.20; used directly by app/services/embedder.py (openai/azure_openai providers)
]

[project.optional-dependencies]
# NOTE: ragas==0.4.3's own package internally imports
# langchain_community.chat_models.vertexai, which was removed upstream in
# langchain-community 0.4.x — this is broken regardless of which version of
# ragas or langchain-community you pick, because langgraph/langchain-openai
# (also required) need the langchain-core major that only newer
# langchain-community ships. There is no version combination that satisfies
# all three at once as of this pin. The backend does NOT depend on this
# extra — app/services/llm_judge.py computes the same metrics via direct
# prompted LLM calls instead. Install this only if you're experimenting
# with obtrac_sdk.evaluator.RAGASEvaluator directly and are prepared to
# manage the conflict yourself.
ragas = ["ragas==0.4.3", "instructor==1.16.0"]
# Declared but not yet wired to a metrics adapter — obtrac_sdk.evaluator's
# legacy MLflow path aside, there's no backend/app/services/metrics/
# mlflow_adapter.py yet (deferred: mlflow pulls in pyarrow, which has no
# prebuilt wheel on some newer Python builds and needs a from-source Arrow
# build to install). deepeval/arize below follow the same guarded-import
# pattern this extra is meant for once an adapter exists.
mlflow = ["mlflow>=2.14.0,<3.0.0"]
# DeepEval and Arize Phoenix's evals library each add metrics to
# GET /evaluation/metrics-info via a guarded import in
# backend/app/services/metrics/registry.py — neither is required for
# ObTrac's own 6 built-in metrics. Note arize-phoenix-evals is Elastic
# License 2.0 (ELv2), not permissive like ObTrac's own MIT license — fine
# as an optional library dependency for self-hosted use, called out here
# for transparency.
deepeval = ["deepeval==4.2.1"]
arize = ["arize-phoenix-evals==3.6.0"]
postgres = ["psycopg2-binary>=2.9.0,<3.0.0"]  # set DATABASE_URL to postgresql+psycopg2://... to use it
ui = [
    "streamlit>=1.35.0,<2.0.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "sentence-transformers>=3.0.0,<7.0.0",
    "pypdf>=4.0.0,<7.0.0",
]
agents = [
    "langgraph==1.2.11",
    "langchain-openai==1.6.0",
]
# Only needed for demos/google_adk — the ADK demo agents themselves run
# through LiteLLM (Anthropic), not Vertex/Gemini, so no Google Cloud
# credentials are required to use this extra.
adk = ["google-adk==2.8.0"]
all = [
    "ragas==0.4.3",
    "instructor==1.16.0",
    "mlflow>=2.14.0,<3.0.0",
    "deepeval==4.2.1",
    "arize-phoenix-evals==3.6.0",
    "streamlit>=1.35.0,<2.0.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "sentence-transformers>=3.0.0,<7.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "langgraph==1.2.11",
    "langchain-openai==1.6.0",
    "google-adk==2.8.0",
]

[project.scripts]
obtrac = "obtrac_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/satyamk9git/ObTrac"
Repository = "https://github.com/satyamk9git/ObTrac"

[tool.setuptools.packages.find]
include = ["obtrac_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests"]
