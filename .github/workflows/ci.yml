name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Exact pins, deliberately — see the comment on the LLM & Eval
      # dependency block in pyproject.toml. A fresh install here is the
      # canary for exactly the kind of upstream breakage (ChatLiteLLM /
      # ChatVertexAI removed from langchain-community) this project hit.
      - name: Install (core, fresh — no cache)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: python -m pytest tests/ backend/tests/ -v

      - name: Import-check the backend app
        run: python -c "from app.main import app; print('app imports cleanly, routes:', len(app.routes))"
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
